name: Public App Validation
on:
  push:
    branches: [main]
  workflow_dispatch:
permissions:
  contents: read
jobs:
  validate:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.11'
          cache: pip
      - name: Install dependencies
        run: python -m pip install -r requirements.txt
      - name: Syntax verification
        run: python -m compileall -q public_app.py public_data.py sector_catalog.py visual_atlas.py ui_theme.py
      - name: Unit tests
        run: python -m unittest discover -s tests -p 'test_*.py' -v
